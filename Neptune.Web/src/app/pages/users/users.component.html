<page-header pageTitle="All Users" [templateRight]="templateRight">
    <ng-template #templateRight>
        <button type="button" class="btn btn-primary" (click)="openInviteModal()"><i class="fa fa-user-plus"></i> Invite User</button>
    </ng-template>
</page-header>

<app-alert-display></app-alert-display>

<div class="page-body">
    <neptune-grid [rowData]="users$ | async" [columnDefs]="columnDefs()" downloadFileName="users"> </neptune-grid>
</div>
