<page-header pageTitle="Trash Analysis Areas" [templateRight]="templateRight"></page-header>

<ng-template #templateRight>
  @if (currentUserHasJurisdictionEditPermission()) {
    <a class="float-right btn btn-primary-outline" [routerLink]="['/data-hub/trash-analysis-area-download']"> <icon [icon]="'Download'"></icon> Download GDB </a>
  }
</ng-template>

<app-alert-display></app-alert-display>

<div class="page-body" [loadingSpinner]="{ isLoading, loadingHeight: 100 }">
  @if (trashGeneratingUnits$ | async; as trashGeneratingUnits) {
    <neptune-grid
      height="800px"
      [rowData]="trashGeneratingUnits"
      [columnDefs]="trashGeneratingUnitsColumnDefs"
      downloadFileName="trash-analysis-areas"
      [pagination]="true"
    [sizeColumnsToFitGrid]="true"></neptune-grid>
  }
</div>
