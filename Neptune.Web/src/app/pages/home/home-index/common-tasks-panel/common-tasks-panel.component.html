<div class="card common-tasks">
    <div class="card-header">
        <h3 class="card-title">Common Tasks</h3>
        <span class="panel-label">Desk</span>
    </div>
    <div class="card-body">
        <ul class="task-list">
            @for (task of tasks$ | async; track task.label) {
                <li>
                    @if (task.route) {
                        <a class="task-row" [routerLink]="task.route">
                            <span>{{ task.label }}</span>
                            <i class="fa fa-angle-right" aria-hidden="true"></i>
                        </a>
                    } @else {
                        <button type="button" class="task-row" (click)="task.action()">
                            <span>{{ task.label }}</span>
                            <i class="fa fa-angle-right" aria-hidden="true"></i>
                        </button>
                    }
                </li>
            }
        </ul>
    </div>
</div>
