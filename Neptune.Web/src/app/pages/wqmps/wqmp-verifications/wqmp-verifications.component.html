<page-header pageTitle="WQMP O&M Verifications" [customRichTextTypeID]="customRichTextTypeID" [templateRight]="templateRight"></page-header>

<ng-template #templateRight>
    @if (currentPersonCanEdit) {
        <button type="button" class="btn btn-primary" (click)="openStartOMVisitModal()"><i class="fa fa-plus"></i> Start O&amp;M Visit</button>
    }
</ng-template>

<app-alert-display></app-alert-display>

@if (verifications$ | async; as verifications) {
    <neptune-grid
        [rowData]="verifications"
        [columnDefs]="columnDefs"
        [pagination]="true"
        [downloadFileName]="'WQMPVerifications'">
    </neptune-grid>
}

<div [loadingSpinner]="{ isLoading: isLoading, loadingHeight: 600 }"></div>
