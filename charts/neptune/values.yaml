global:
  env:
    name: "qa"
    # NPT-1112: named Key Vault the API + ExternalAPI read at startup via
    # DefaultAzureCredential; set by the pipeline (--set global.env.keyVaultName).
    keyVaultName: ""
    dbServer: "db-server.database.windows.net"
    databaseName: "NeptuneDB"
    sqlUsername: "SqlAdministrator"
    sqlGeoserverUsername: "NeptuneGeo"
    # NPT-1112: non-secret app config, moved out of the deleted API k8s secret
    # into the ConfigMap.
    claudeModelId: "claude-sonnet-4-6"
    appInsightsInstrumentationKey: "00000000-0000-0000-0000-000000000000"
  domains:
    api: "api-neptune.aks-qa.sitkatech.com"
    externalApi: "externalapi-neptune.aks-qa.sitkatech.com"
    web: "web-neptune.aks-qa.sitkatech.com"
    geoserver: "geoserver-neptune.aks-qa.sitkatech.com"
    nereid: "neptune-nereid"
    gdalApi: "neptune-gdalapi"
    overlayApi: "neptune-overlayapi"
    nereidRedis: "neptune-nereid-redis:6379"
  secrets:
    geoserverSqlServerPassword: "passwordhere"
    geoserverAdminPassword: "geomaster"
    applicationStorageAccountName: "neptuneapplicationgrsqa"
    applicationStorageAccountKey:  "longkeyreplacedhere"
    apiSqlPassword: "passwordhere"
    sendGridApiKey: "sendgridapikeyhere"
    hangfirePassword: "passwordhere"
    recaptchaV3SiteKey: "recaptchaV3SiteKeyHere"
    recaptchaV3SecretKey: "recaptchaV3SecretKeyHere"
    anthropicApiKey: "anthropicApiKeyHere"
  # NPT-1112: user-assigned managed identity the api/externalapi ServiceAccounts
  # federate to; ids come from neptune.tf outputs via helm --set.
  workloadIdentity:
    clientId: ""
    tenantId: ""

api:
  replicaCount: 1
  image:
    repository: containersesaqa.azurecr.io/neptune/api
    pullPolicy: Always
  nameOverride: ""
  fullnameOverride: ""
  namespace: h2o
  resources:
    requests:
      memory: "1G"
    limits:
      memory: "8G"
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""
  podAnnotations: {}
  podSecurityContext: {}
    # fsGroup: 2000
  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: "azure-application-gateway"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      acme.cert-manager.io/http01-edit-in-place: "true"
      appgw.ingress.kubernetes.io/ssl-redirect: "true"
      appgw.ingress.kubernetes.io/request-timeout: "300"
      cert-manager.io/issue-temporary-certificate: "true"
      appgw.ingress.kubernetes.io/connection-draining: "true"
      appgw.ingress.kubernetes.io/connection-draining-timeout: "30"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  nodeSelector:
    agentpool: appnodepool
  tolerations: []
  affinity: {}

