apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geoserver.fullname" . }}
  labels:
    tags.datadoghq.com/env: {{ .Values.global.env.name | quote }}
    tags.datadoghq.com/service: {{ include "geoserver.fullname" . }}
    {{- include "geoserver.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: 1 # Default to 10 if not specified
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # AGC migration: behind Envoy a pod must never be the only one serving while it
  # is draining, so surge before taking the old one down.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "geoserver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        ad.datadoghq.com/tags: '{"teamName": "{{ .Values.namespace }}"}'
        rollme: {{ randAlphaNum 5 | quote }} # roll deployments on every upgrade: https://helm.sh/docs/howto/charts_tips_and_tricks/#automatically-roll-deployments
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "geoserver.selectorLabels" . | nindent 8 }}
    spec:
      volumes:
      - name: geoserver-data
        azureFile: 
          secretName: neptune-geoserver-volume-secret
          shareName: geoserver
          readOnly: false
      - name: config
        projected:
          sources:
          - configMap:
              name: {{ include "geoserver.fullname" . }}-environment-properties-configmap
      - name: secrets
        secret:
          secretName: neptune-geoserver-secrets
          items:
          - key: geoserverSqlServerPassword
            path: geoserverSqlServerPassword
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "geoserver.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
          - name: http
            containerPort: 8080
            protocol: TCP
        # this startup probe checks the app every 10 seconds to see if it's ready to receive traffic
        # it gives a very generous 5 minutes for geoserver to startup. As soon as it is successful
        # the liveness probe kicks into effect.
        startupProbe: 
          httpGet:
            path: /geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png
            scheme: HTTP
            port: 8080
          failureThreshold: 30
          periodSeconds: 10
        # this livenessProbe gets called every 4 seconds, if it fails three times in a row it determines
        # the pod as unreachable and attempts to kill it and start a new pod
        livenessProbe:
          httpGet:
            path: /geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png
            scheme: HTTP
            port: 8080
          periodSeconds: 4
          timeoutSeconds: 5
          failureThreshold: 3
        # this readinessProbe lets kubernetes know that it's fully deployed and can start directing traffic to it
        readinessProbe:
          httpGet:
            path: /geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png
            scheme: HTTP
            port: 8080
        lifecycle:
          preStop:
            exec:
              # AGC migration: the drain wait tracks whoever is routing to us.
              # While the Ingress exists, App Gateway is still sending traffic here
              # and is slow to drop a backend, so keep the original 120s. Once the
              # Ingress is gone (deploy two) only Envoy routes to us, and it removes
              # an endpoint in about a second, so 5s is ample.
              command: ["sleep","{{ if .Values.ingress.enabled }}120{{ else }}5{{ end }}"]
        volumeMounts:
        - name: secrets
          mountPath: /app/secrets
          readOnly: true
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: geoserver-data
          mountPath: /opt/geoserver
          readOnly: false
        envFrom:
        - configMapRef:
            name: {{ include "geoserver.fullname" . }}-configmap
        env:
        - name: GEOSERVER_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: neptune-geoserver-secrets
              key: geoserverAdminPassword
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      terminationGracePeriodSeconds: {{ if .Values.ingress.enabled }}131{{ else }}45{{ end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
