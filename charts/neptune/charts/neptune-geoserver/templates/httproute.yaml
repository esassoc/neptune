{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "geoserver.fullname" . }}
  labels:
    {{- include "geoserver.labels" . | nindent 4 }}
spec:
  # apps-gateway is the in-cluster Envoy Gateway in `default`, a single
  # hostname-less listener on port 80. Name only: no port, no sectionName.
  parentRefs:
  - name: {{ .Values.httproute.gateway.name }}
    namespace: {{ .Values.httproute.gateway.namespace }}
  hostnames:
  - {{ .Values.global.domains.geoserver | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "geoserver.fullname" . }}
      port: {{ .Values.service.port }}
    timeouts:
      request: {{ .Values.httproute.requestTimeout | default "60s" }}
{{- end }}
