{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "overlayapi.serviceAccountName" . }}
  labels:
    # NPT-1112: opts this ServiceAccount into AKS workload identity. The ids
    # flow from neptune.tf outputs via helm --set global.workloadIdentity.*.
    azure.workload.identity/use: "true"
    {{- include "overlayapi.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.global.workloadIdentity.clientId | quote }}
    azure.workload.identity/tenant-id: {{ .Values.global.workloadIdentity.tenantId | quote }}
  {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
