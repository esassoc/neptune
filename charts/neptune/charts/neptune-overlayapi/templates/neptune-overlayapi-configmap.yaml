apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "overlayapi.fullname" . }}-configmap
data:
  ASPNETCORE_URLS: "http://+:80"
  # NPT-1112: KeyVaultName drives the startup secret load (DefaultAzureCredential
  # via workload identity); SECRET_PATH from the mounted-secret era is gone.
  KeyVaultName: "{{ .Values.global.env.keyVaultName }}"