apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    tags.datadoghq.com/env: {{ .Values.global.env.name | quote }}
    tags.datadoghq.com/service: {{ include "api.fullname" . }}
    tags.datadoghq.com/version: {{ .Values.image.tag | quote }}
    {{- include "api.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: 1 # Default to 10 if not specified
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # AGC migration: behind Envoy a pod must never be the only one serving while it
  # is draining, so surge before taking the old one down.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        ad.datadoghq.com/tags: '{"teamName": "{{ .Values.namespace }}"}'
        rollme: {{ randAlphaNum 5 | quote }}  # roll deployments on every upgrade: https://helm.sh/docs/howto/charts_tips_and_tricks/#automatically-roll-deployments
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        # NPT-1112: workload-identity webhook opt-in. A literal line on purpose —
        # NOT part of selectorLabels, which also renders the immutable
        # spec.selector.matchLabels.
        azure.workload.identity/use: "true"
        {{- include "api.selectorLabels" . | nindent 8 }}
    spec:
      # NPT-1112: secret file mount removed — secrets flow from Azure Key Vault
      # at startup via DefaultAzureCredential (KeyVaultName in the ConfigMap).
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # this startup probe checks the app every 10 seconds to see if it's ready to receive traffic
          # it gives a very generous 5 minutes for the container to startup. As soon as it is successful
          # the liveness probe kicks into effect.
          startupProbe: 
            httpGet:
              path: /
              scheme: HTTP
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              scheme: HTTP
              port: 8080
            periodSeconds: 4
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              scheme: HTTP
              port: 8080
          lifecycle:
            preStop:
              exec:
                # AGC migration: the drain wait tracks whoever is routing to us.
                # While the Ingress exists, App Gateway is still sending traffic here
                # and is slow to drop a backend, so keep the original 120s. Once the
                # Ingress is gone (deploy two) only Envoy routes to us, and it removes
                # an endpoint in about a second, so 5s is ample.
                command: ["sleep","{{ if .Values.ingress.enabled }}120{{ else }}5{{ end }}"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          envFrom:
          - configMapRef:
              name: {{ include "api.fullname" . }}-{{ .Values.global.env.name }}-configmap
      terminationGracePeriodSeconds: {{ if .Values.ingress.enabled }}131{{ else }}45{{ end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
