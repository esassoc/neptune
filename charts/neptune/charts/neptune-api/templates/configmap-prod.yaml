{{ if eq .Values.global.env.name "prod" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api.fullname" . }}-prod-configmap
data:
  DOCKER_BUILD_SOURCE: "."
  ASPNETCORE_ENVIRONMENT: "Production"
  # NPT-1112: KeyVaultName drives the startup secret load (DefaultAzureCredential
  # via workload identity); SECRET_PATH from the mounted-secret era is gone.
  KeyVaultName: "{{ .Values.global.env.keyVaultName }}"
  HangfireUserName: "HangfireAdmin"
  ClaudeModelId: "{{ .Values.global.env.claudeModelId }}"
  APPINSIGHTS_INSTRUMENTATIONKEY: "{{ .Values.global.env.appInsightsInstrumentationKey }}"
  SitkaEmailRedirect: ""
  SitkaSupportEmail: "h2o.team@esassoc.com"
  DoNotReplyEmail: "donotreply@ocstormwatertools.org"
  MailLogBcc: ""
  OcStormwaterToolsBaseUrl: "https://{{ .Values.global.domains.web }}"
  NereidUrl: "http://{{ .Values.global.domains.nereid }}"
  GDALAPIBaseUrl: "http://{{ .Values.global.domains.gdalApi }}"
  OverlayAPIBaseUrl: "http://{{ .Values.global.domains.overlayApi }}"
  OCGISBaseUrl: "https://ocgis.com/arcpub/rest/services/"
  PathToFieldVisitUploadTemplate: "Bulk_Upload_FieldVisists_for_Trash_Screens_Template.xlsx"
  PathToOVTAUploadTemplate: "OVTAAssessment_BulkUpload_Template.xlsx"
  PathToSimplifiedBMPTemplate: "Simplified_BMPs_Bulk_Upload_Template.xlsx"
  PathToBulkUploadWQMPTemplate: "WQMP_Bulk_Upload_Template.xlsx"
  PathToUploadWQMPBoundaryTemplate: "WQMP_Boundary_Bulk_Upload_Template.csv"
{{ end }}