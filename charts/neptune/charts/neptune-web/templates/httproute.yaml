{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "web.fullname" . }}
  labels:
    {{- include "web.labels" . | nindent 4 }}
spec:
  # apps-gateway is the in-cluster Envoy Gateway in `default`, a single
  # hostname-less listener on port 80. Name only: no port, no sectionName.
  parentRefs:
  - name: {{ .Values.httproute.gateway.name }}
    namespace: {{ .Values.httproute.gateway.namespace }}
  hostnames:
  - {{ .Values.global.domains.web | quote }}
  {{- if eq .Values.global.env.name "prod" }}
  # NPT-1098: prod canonical host is the apex (domains.web = ocstormwatertools.org).
  # www is served here as well; the SPA canonical-redirects it to the apex on
  # bootstrap. Mirrors the second host in ingress.yaml.
  - "www.ocstormwatertools.org"
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "web.fullname" . }}
      port: {{ .Values.service.port }}
    timeouts:
      request: {{ .Values.httproute.requestTimeout | default "60s" }}
{{- end }}
